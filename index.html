<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Vozcalizador: acomoda y encuentra por voz</title>
<meta name="description" content="Registre, explore y ubique por voz los objetos de cualquier colección.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Plan: interfaz de celular a pantalla completa (centrada en computadora). Teal para lo gratis y la acción principal, ámbar para lo de pago. */
:root{
  --fondo:#eef2f1; --papel:#ffffff; --tinta:#0b1a17; --suave:#2f403c; --linea:#3b4240;
  --acento:#0f766e; --acento-suave:#d9efeb; --sobre-acento:#ffffff; --pago:#a8670f; --pago-suave:#fbf0dc; --error:#c53030; --duda:#2b6cb0;
  --f-titulo:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-texto:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fondo:#0b1312;--papel:#14201e;--tinta:#f1f7f5;--suave:#c3d1ce;--linea:#8b9794;--acento:#3fb8a9;--acento-suave:#163a35;--pago:#e3a945;--pago-suave:#3a2c12;--error:#fc8181;--duda:#90cdf4;color-scheme:dark}}
:root[data-theme="dark"]{--fondo:#0b1312;--papel:#14201e;--tinta:#f1f7f5;--suave:#c3d1ce;--linea:#8b9794;--acento:#3fb8a9;--acento-suave:#163a35;--pago:#e3a945;--pago-suave:#3a2c12;--error:#fc8181;--duda:#90cdf4;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--tinta);font-family:var(--f-texto);font-size:16px;line-height:1.45;display:flex;justify-content:center}
h1,h2,h3{font-family:var(--f-titulo);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.app{width:100%;max-width:480px;height:100%;background:var(--papel);display:flex;flex-direction:column;border-left:1.5px solid var(--linea);border-right:1.5px solid var(--linea)}
.barra{padding:14px 16px 10px;border-bottom:1.5px solid var(--linea);display:flex;align-items:center;gap:10px}
.barra h1{font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca{font-family:var(--f-titulo);font-weight:800;color:var(--acento);font-size:.85rem}
.chip{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--acento-suave);color:var(--acento);white-space:nowrap}
.chip.pago{background:var(--pago-suave);color:var(--pago)}
.cuerpo{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.pestanas{display:grid;grid-template-columns:repeat(5,1fr);border-top:1.5px solid var(--linea);background:var(--papel)}
.pestanas button{border:0;background:none;padding:8px 2px 12px;font-size:.7rem;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px}
.pestanas button span{font-size:1.2rem;line-height:1}
.pestanas button[aria-selected="true"]{color:var(--acento);font-weight:700}
.boton{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--acento);color:var(--sobre-acento)}
.boton.sec{background:var(--acento-suave);color:var(--acento)}
.boton.peligro{background:none;color:var(--error);border:1.5px solid var(--linea)}
.boton.grande{padding:14px;font-size:1.05rem;width:100%}
.boton:disabled{opacity:.5;cursor:not-allowed}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fila > .boton{flex:1}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label,.etq{font-size:.8rem;font-weight:700;color:var(--suave)}
.campo input,.campo select,textarea,.entrada{border:1.5px solid var(--linea);border-radius:10px;padding:10px;background:var(--papel);width:100%}
textarea{min-height:110px;resize:vertical}
.grupo{font-size:.76rem;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.tarjeta{border:1.5px solid var(--linea);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.plantilla{border:1.5px solid var(--linea);border-radius:14px;padding:12px;background:var(--papel);text-align:left;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%}
.plantilla b{display:block}
.plantilla small{color:var(--suave)}
.plantilla .ico{font-size:1.6rem;text-align:center}
.desplegable{border:1.5px solid var(--linea);border-radius:10px;max-height:320px;overflow-y:auto;background:var(--papel);margin-top:4px}
.desplegable .amb{font-size:.76rem;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px 4px}
.desplegable button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--linea);background:none;padding:9px 12px}
.desplegable button small{display:block;color:var(--suave);font-size:.78rem}
.plantilla.bloqueada{background:var(--pago-suave);border-color:transparent}
.objeto{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px;border:1.5px solid var(--linea);border-radius:12px;background:var(--papel);text-align:left;width:100%}
.mini{width:48px;height:60px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-titulo);font-weight:800;color:#fff;font-size:1.1rem;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.objeto b{display:block;font-size:.95rem;line-height:1.2}
.objeto small{color:var(--suave);font-size:.78rem}
.lugar{font-family:var(--f-titulo);font-weight:800;color:var(--acento);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.mas{border:1.5px dashed var(--acento);color:var(--acento);background:none;border-radius:10px;padding:9px 12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--linea);background:var(--papel);border-radius:999px;padding:6px 11px;font-size:.82rem}
.chips button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.chips button.bloqueada{background:var(--pago-suave);border-color:transparent;color:var(--suave)}
.opcion{border:1.5px solid var(--linea);background:var(--papel);border-radius:10px;padding:9px 11px;font-size:.88rem;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%}
.opcion[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-suave);font-weight:700}
.opcion.bloqueada{color:var(--suave);background:var(--pago-suave);border-color:transparent}
.candado{font-size:.72rem;font-weight:700;color:var(--pago);white-space:nowrap}
.aviso{font-size:.84rem;color:var(--suave);background:var(--fondo);border-radius:10px;padding:9px 11px}
.aviso.pago{background:var(--pago-suave);color:var(--tinta)}
.aviso.bien{background:var(--acento-suave);color:var(--tinta)}
.aviso:empty{display:none}
.nivel{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:center}
.nivel span{font-weight:800;color:var(--acento);text-align:center}
.lugares{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.res{border-left:4px solid var(--acento);padding:7px 10px;background:var(--acento-suave);border-radius:0 10px 10px 0}
.res.duda{border-color:var(--duda);background:rgba(43,108,176,.1)}
.res.no{border-color:var(--error);background:rgba(197,48,48,.08)}
.res b{display:block}
.res .dice{font-family:var(--f-titulo);font-weight:800;color:var(--acento);font-size:1.05rem}
.res .opciones{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--acento);color:var(--sobre-acento);font-size:1.9rem;align-self:center}
.mic.activo{background:var(--error);box-shadow:0 0 0 8px rgba(197,48,48,.18)}
.foto-previa{width:100%;max-height:180px;object-fit:contain;border-radius:10px;background:var(--fondo)}
.guia ol{margin:6px 0 8px 1.1rem;padding:0;font-size:.86rem;line-height:1.45}.guia li{margin-bottom:4px}.guia .dicho{background:var(--acento-suave);border-radius:8px;padding:8px 10px;font-size:.9rem;font-style:italic;margin:4px 0 8px}.guia table{font-size:.78rem}
.vista{border:1.5px solid var(--linea);border-radius:10px;padding:10px;font-size:.84rem;max-height:220px;overflow:auto;background:var(--fondo)}
.vista table{border-collapse:collapse;width:100%}
.vista td,.vista th{border:1.5px solid var(--linea);padding:3px 6px;text-align:left}
.vista h4{margin:6px 0 4px;font-family:var(--f-titulo)}
.vista p{margin:0 0 6px}
.dialogo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.dialogo .hoja{background:var(--papel);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto}
.precio{font-family:var(--f-titulo);font-weight:800;font-size:2rem;color:var(--pago)}
.oculto{display:none!important}
.vacio{text-align:center;color:var(--suave);padding:24px 8px}
.interruptor{display:flex;justify-content:space-between;align-items:center;gap:10px}
.interruptor input{width:46px;height:26px;accent-color:var(--pago)}
.tanda{border:1.5px solid var(--linea);border-radius:12px;padding:0 10px;background:var(--papel)}
.tanda summary{min-height:50px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:.9rem}
.tanda summary::-webkit-details-marker{display:none}
.tanda summary::after{content:"▾";margin-left:auto;color:var(--acento);font-weight:800}
.tanda[open] summary::after{content:"▴"}
.tanda .contenido{display:flex;flex-direction:column;gap:6px;padding:0 0 10px}
.objeto.fuera b{color:var(--suave)}
.muestra{display:inline-flex;align-items:center;gap:10px}
.muestra i{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--linea)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="barra">
    <span class="marca" aria-hidden="true">◉</span>
    <h1 id="titulo">Vozcalizador</h1>
    <span class="chip" id="chipPlan">Gratis</span>
  </header>
  <main class="cuerpo" id="cuerpo"></main>
  <nav class="pestanas" id="pestanas" role="tablist" aria-label="Secciones">
    <button role="tab" data-p="lista" aria-selected="true"><span>▦</span>Colección</button>
    <button role="tab" data-p="agregar" aria-selected="false"><span>＋</span>Agregar</button>
    <button role="tab" data-p="tandas" aria-selected="false"><span>🎙</span>Ubicar</button>
    <button role="tab" data-p="explorar" aria-selected="false"><span>🔊</span>Explorar</button>
    <button role="tab" data-p="mas" aria-selected="false"><span>☰</span>Más</button>
  </nav>
</div>
<div id="capa"></div>

<script>

var PRECIO = '79 pesos';
var LIMITES = {colecciones:1, campos:2, donde:2, que:1, fotos:1, documentosPrueba:1, historial:2};  // documentosPrueba: por tipo (1 de Word y 1 de Excel)

  ]],
  ['Pasatiempos','🎨',[

  [].concat.apply([], AMBITOS.map(function(a){return a[2].map(function(x){return {id:x[0], ico:a[1], ambito:a[0], t:x[1], niveles:x[2], clasif:x[3], campos:x[4]};});})));
/* Botón «+ catalogación»: lo que la voz dice de cada objeto. «¿Dónde va?» = ubicación física; «¿Qué es?» = clasificación.
   Gratis: 2 de «¿Dónde va?» y 1 de «¿Qué es?», las que el usuario elija (LIMITES.donde y LIMITES.que). Los valores fijos se tocan en lugar de escribirse. */

var CLASIFICACIONES = {
  'Categoría':null, 'Subcategoría':null,

  'Material':['plástico','madera','metal','papel','tela'],

  'Grado o grupo':null,
  'Frecuencia de uso':['diario','frecuente','ocasional','extraordinario']
};
function caben(grupo,lista){return libre()||lista.length<LIMITES[grupo];}  // ¿se puede agregar otra opción de ese grupo?
var ORDENES = [
  {id:'alfa', t:'Alfabético', gratis:true},
  {id:'lugar', t:'Por lugar', gratis:true},
  {id:'recientes', t:'Más recientes primero', gratis:false},
  {id:'categoria', t:'Por categoría', gratis:false}
];
var CATALOGO = {   // campos que se pueden registrar; cada colección ve los generales y los que le tocan en CAMPOS_DE (los números son situaciones del texto del usuario)

   Se pide al navegador almacenamiento persistente para que no borre los datos cuando el teléfono necesita espacio.

function iniciarDatos(){
  return new Promise(function(listo){
    var conDatos=function(s,porClave,deOtraBase){
      var antiguo=deOtraBase||!s||!s.json;   // sin registro, de la base anterior o guardado con el formato anterior (todo junto)
      if(s&&s.json){s=JSON.parse(s.json); s.colecciones.forEach(function(c){c.objetos.forEach(function(o){o.fotos=(o.fotos||[]).map(function(k){var f=porClave.get(k); if(f) CLAVE_FOTO.set(f,k); return f;}).filter(Boolean);});});}
      if(!s){try{s=JSON.parse(localStorage.getItem(CLAVE_ANTERIOR));}catch(e){}}

      if(BD&&s&&antiguo){guardar(); try{localStorage.removeItem(CLAVE_ANTERIOR);}catch(e){}}

      listo();
    };
    try{
      var r=indexedDB.open(BASE,1);
      r.onupgradeneeded=function(){var db=r.result; db.createObjectStore('datos'); db.createObjectStore('fotos');};
      r.onsuccess=function(){
        BD=r.result; BD.onversionchange=function(){BD.close(); aviso('Se abrió una versión más nueva de la app en otra pestaña. Cierre esta para seguir trabajando allá.','pago');};

          if(datos) return conDatos(datos,porClave,false);

var BASE='vozcalizador', BASE_ANTERIOR='organizador-interactivo';   // la app se llamaba «Organizador interactivo»
// Lee de una base el registro de datos y todas las fotos (la base más antigua no tenía almacén de fotos).
function leerBase(db,clave,listo){
  try{
    var almacenes=['datos','fotos'].filter(function(n){return db.objectStoreNames.contains(n);}), datos=null, porClave=new Map();
    if(almacenes.indexOf('datos')<0) return listo(null,porClave);
    var t=db.transaction(almacenes);
    t.objectStore('datos').get(clave).onsuccess=function(ev){datos=ev.target.result||null;};
    if(almacenes.indexOf('fotos')>=0) t.objectStore('fotos').openCursor().onsuccess=function(ev){var cur=ev.target.result; if(cur){porClave.set(cur.key,cur.value); cur.continue();}};
    t.oncomplete=function(){listo(datos,porClave);}; t.onerror=t.onabort=function(){listo(null,porClave);};
  }catch(e){listo(null,new Map());}
}
// Datos guardados cuando la app tenía su nombre anterior: se copian una vez a la base nueva. La base vieja se deja intacta.
function leerAnterior(listo){
  if(!indexedDB.databases) return listo(null,new Map());
  indexedDB.databases().then(function(lista){
    if(!lista.some(function(d){return d.name===BASE_ANTERIOR;})) return listo(null,new Map());
    var r=indexedDB.open(BASE_ANTERIOR);
    r.onsuccess=function(){var db=r.result; leerBase(db,CLAVE_ANTERIOR,function(d,f){db.close(); listo(d,f);});};
    r.onerror=function(){listo(null,new Map());};
  }).catch(function(){listo(null,new Map());});
}

/* Hoja del botón «+ catalogación»: dos grupos y una opción propia en cada uno. Lo de pago lleva candado y abre la ventana de pago. */
function elegirCatalogacion(c,alElegir){

    +'<div class="grupo">¿Qué es?</div>'+libres(Object.keys(CLASIFICACIONES),c.clasif).map(function(n){return opcion('que',n);}).join('')+propia('que')

    lista.push(n); alElegir();

}

/* ---- Dictar objetos: convierte lo dictado en objetos con su catalogación ----
   Palabras clave: el nombre de una catalogación o de un campo seguido de su valor («cajón dos», «categoría ropa interior», «talla mediana»);
   un ordinal antes de una catalogación de «¿Dónde va?» («primer cajón» = cajón 1); «primer orden …», «segundo orden …» (niveles de «¿Dónde va?» por su orden);
   «clasificación …» (la primera de «¿Qué es?»); «en el …» + un valor ya usado; «siguiente objeto» separa objetos.
   Lo demás es el nombre del objeto. Cada valor se queda puesto para los objetos siguientes hasta que se cambie. Una pausa, un punto o una coma cierran el valor. */
var SOBRAN={en:1,el:1,la:1,los:1,las:1,de:1,del:1,al:1,con:1,y:1,un:1,una:1};   // se quitan al principio y al final de un nombre o valor dictado («en el», «de»), no letras sueltas como la «A» de «Plan A»

    var alias=[nombre].concat(nombre.indexOf(' o ')>0?nombre.split(' o '):[]);
    alias.forEach(function(a){claves.push({tipo:tipo,nombre:nombre,i:i,p:palabras(a)});});
  };
  c.niveles.forEach(function(n,i){clave('donde',n,i);}); cl.forEach(function(n){clave('que',n);}); c.campos.forEach(function(n){clave('campo',n);});

  var conocer=function(k,v){var p=palabras(v); if(p.length&&!conocidos.some(function(x){return x.k.nombre===k.nombre&&x.p.join(' ')===p.join(' ');})) conocidos.push({k:k,p:p,v:v});};
  claves.forEach(function(k){
    c.objetos.forEach(function(o){var v=k.tipo==='donde'?(o.lugar||[])[k.i]:k.tipo==='que'?(o.clasif||{})[k.nombre]:(o.campos||{})[k.nombre]; if(v) conocer(k,v);});

    if(nombre.length){

      o.nombre=txt.charAt(0).toUpperCase()+txt.slice(1);

      if(captura.k.tipo==='donde'&&b.length===1&&/^\d+$/.test(b[0].n)) cerrarCaptura();   // «cajón dos boxers»: el número cierra el valor
      else if(captura.k.tipo==='que'&&(CLASIFICACIONES[captura.k.nombre]||[]).some(function(f){return palabras(f).join(' ')===b.map(function(x){return x.n;}).join(' ');})) cerrarCaptura();   // «color azul»: un valor de la lista cierra el valor

    }

  }
  cerrarObjeto();
  return objetos;
}
/* ---- Motor de identificación por voz ----
   Reconoce nombres dictados de corrido, con errores de pronunciación, nombres incompletos, números dichos con letra,
   objetos repetidos y pistas dichas después del nombre («… de tal marca», «… con tal color»), que se buscan en los campos
   y la catalogación de cada objeto. Nunca inventa: lo que no se parece a nada sale como «no está en la colección». */
var motorIdentificacion=(function(){
  var SEPARADORES=new Set(['y','luego','siguiente','otro']);
  var CONECTORES=new Set('el la los las un una unos unas de del al a y e o u en con por para que se su sus lo le mi tu es no ni mas como sin sobre entre'.split(' '));
  var ANUNCIOS=new Set('de del con por marca color talla autor autora serie coleccion la el los las'.split(' '));
  var ARTICULOS=new Set(['la','el','los','las']);
  var SIMILITUD_MINIMA=0.72, PESO_DESCONOCIDA=5, UMBRAL_CLARO=0.7, UMBRAL_DUDA=0.45, MARGEN=0.1, MAX_PALABRAS=16,
      COSTO_POR_NOMBRE=1.5, UMBRAL_CON_PISTA=0.3, AYUDA_DE_PISTA=0.15, VALOR_PISTA=8, MAX_PISTA=6, BONO_EXACTO=0.05;

  function fonetica(p){return p.replace(/ch/g,'x').replace(/h/g,'').replace(/qu/g,'k').replace(/g(?=[ei])/g,'j').replace(/gu(?=[ei])/g,'g').replace(/c(?=[ei])/g,'s').replace(/c/g,'k').replace(/z/g,'s').replace(/v/g,'b').replace(/ll/g,'y').replace(/w/g,'u').replace(/y$/,'i').replace(/(.)\1+/g,'$1');}

    });

    function piezasDe(texto){

function encenderMic(op){
  if(dictador.quiere) return detenerMic();
  var bloqueo=bloqueoMic(); if(bloqueo){anotarMic(bloqueo); return estadoDictado(MENSAJES_MIC[bloqueo]+TECLADO,'pago');}
  if(navigator.onLine===false){anotarMic('network'); return estadoDictado(MENSAJES_MIC.network+TECLADO,'pago');}
  if(!reconocedor) crearReconocedor();
  dictador.caja=op.caja||''; dictador.sep=op.sep||'\n'; dictador.alCambiar=op.alCambiar||null; dictador.unaFrase=op.unaFrase||null;
  dictador.quiere=true; dictador.fallos=0; dictador.ultimaVoz=Date.now(); dictador.motivo='';

    $('avisoPrueba').textContent=libre()?'':'Versión gratis: 1 documento de Word y 1 de Excel de prueba. '+['word','excel'].map(function(t){return NOMBRE[t]+': '+(quedaPrueba(t)?'disponible':'ya usado');}).join(' · ')+'.';
  };
  $('tW').onclick=function(){tipo='word';pinta();};
  $('tE').onclick=function(){tipo='excel';pinta();};
  $('txtDoc').oninput=pinta;
  $('mic').onclick=function(){encenderMic({caja:'txtDoc',sep:' ',alCambiar:pinta});};
  $('guardaDoc').onclick=function(){
    var t=$('txtDoc').value.trim(); if(!t) return aviso('Dicte o escriba algo primero.','pago');
    if(!libre()&&!quedaPrueba(tipo)) return ofrecerPago('Dictar más documentos de '+NOMBRE[tipo]);
    var prueba=!libre(), d=armarDoc(t,tipo), nombre='Documento dictado.'+(tipo==='word'?'docx':'xlsx');
    descargar(nombre,tipo==='word'?crearDOCX(d.bloques):crearXLSX(d.filas,'Dictado')).then(function(r){
      if(r==='ok'&&prueba){E.pruebasDictado=E.pruebasDictado||{};E.pruebasDictado[tipo]=usados(tipo)+1;guardar();pinta();}
      aviso(r==='ok'?'Documento guardado: '+nombre+(prueba?'. Ese fue su documento de prueba de '+NOMBRE[tipo]+'.':''):r==='no'?'Guardado cancelado; su documento de prueba sigue disponible.':'No se pudo guardar el archivo aquí.',r==='ok'?'bien':'pago');
    });
  };
  pinta();
}
